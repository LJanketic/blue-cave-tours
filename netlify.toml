# https://docs.astro.build/en/guides/deploy/netlify/
[build]
	command = "pnpm run build"
	publish = "dist"
	# Each production deploy costs 15 of the Free plan's 300 monthly credits.
	# Skip the build when a push only touches files that don't affect the site
	# (docs, design files, README). `git diff --quiet` exits 0 (skip) when none of
	# the listed paths changed since the last build. A redeploy of the SAME commit
	# (e.g. "Trigger deploy" after changing env vars) always builds: the refs are
	# equal, so the test fails and the command exits non-zero. An empty
	# CACHED_COMMIT_REF also builds: `git diff <one ref>` would otherwise compare
	# against the clean checkout and wrongly report "no changes".
	# `netlify` is the scheduled function (netlify/functions/nightly.mts).
	ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src netlify public scripts package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc .nvmrc astro.config.mjs tsconfig.json netlify.toml"

[build.environment]
	# Pinned: Astro 7.4 needs Node >= 22.23.4 (package.json engines). A bare
	# "22" could resolve to an older cached 22.x on Netlify's build image.
	NODE_VERSION = "22.23.5"

# Deploy previews open the demo checkout to everyone, so a preview can be
# tested end to end without the admin's demo-access cookie. Production never
# does (src/config/payments.ts ignores DEMO_CHECKOUT there): guests see that
# online payment isn't open yet. Read at build time.
[context.deploy-preview.environment]
	DEMO_CHECKOUT = "open"

[[headers]]
  for = "/*"
  # Keep in step with src/config/security-headers.ts: these rules don't reach
  # server-rendered responses, so middleware sets the same values there. That
  # includes the 404 for unknown URLs, which the function serves (P2-1).
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # No includeSubDomains or preload: after the move to hellobluecave.com the
    # cPanel subdomains (mail, webmail, cpanel) must all serve HTTPS first, and
    # a preload listing is very hard to undo.
    Strict-Transport-Security = "max-age=31536000"
    # 'unsafe-inline' on script-src/style-src is required, and none of it is
    # nonced: Astro inlines small page scripts (Header menu, contact form, about
    # and destination pages) and the island hydration bootstrap, and pages set
    # inline style="" (image placeholder colours, the destination "best time to
    # visit" bars, the booking calendar and FAQ components).
    # challenges.cloudflare.com is the Turnstile widget on the contact form (a
    # script plus an iframe); it only loads once PUBLIC_TURNSTILE_SITE_KEY is set.
    # Everything else, including the icon font, is served from this origin.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src https://challenges.cloudflare.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Root files that keep their name across deploys: a day in the browser cache, not a revalidation per view.
[[headers]]
  for = "/og-default.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
